[project]
name = "fastapi-object-pagination"
version = "0.1.0"
description = "Simple FastAPI pagination for SQLModel and Neontology"
readme = "README.md"
authors = [
{ name = "Alexandre BERREBI", email = "alexandre.berrebi@businessagile.eu" },
]
requires-python = ">=3.10"

[project.optional-dependencies]
neontology = ["neontology>=2.2.2"]
sqlmodel = ["sqlmodel>=0.0.25"]


[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
markers = [
"neontology: tests aiming only 'neontology' ORM",
"sqlmodel: tests aiming only 'sqlmodel' ORM",
]

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"
